<title>字母拼读每日打卡</title>
<style>
:root{
  --bg:#fdf6ec; --card:#fff; --main:#ff8a5c; --main-d:#f2703f;
  --green:#5cb85c; --blue:#5b9bd5; --text:#4a3b32; --muted:#a89a8e;
  --gold:#f5b942; --shadow:0 4px 16px rgba(200,150,100,.18);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;max-width:520px;margin:0 auto;padding-bottom:40px}
header{background:linear-gradient(135deg,#ffb347,#ff8a5c);color:#fff;padding:22px 18px 18px;border-radius:0 0 24px 24px;box-shadow:var(--shadow)}
header h1{font-size:22px;display:flex;align-items:center;gap:8px}
header p{font-size:13px;opacity:.9;margin-top:4px}
.stats{display:flex;gap:10px;margin-top:14px}
.stat{flex:1;background:rgba(255,255,255,.22);border-radius:12px;padding:8px;text-align:center;backdrop-filter:blur(4px)}
.stat b{font-size:20px;display:block}
.stat span{font-size:11px;opacity:.9}
nav{display:flex;margin:14px 12px 0;background:#fff;border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
nav button{flex:1;border:none;background:none;padding:12px 0;font-size:15px;color:var(--muted);font-weight:600;transition:.2s}
nav button.active{background:var(--main);color:#fff;border-radius:14px}
.page{display:none;padding:14px 12px}
.page.show{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
/* 今日任务 */
.day-head{text-align:center;margin-bottom:6px}
.day-label{font-size:13px;color:var(--muted)}
.big-letter{font-size:84px;font-weight:800;color:var(--main);line-height:1;font-family:'Arial Rounded MT Bold',Arial,sans-serif}
.big-letter.lower{color:var(--blue)}
.sound{font-size:18px;color:var(--text);margin:6px 0 2px}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:14px;font-size:16px;font-weight:700;color:#fff;background:var(--main);box-shadow:0 4px 12px rgba(255,138,92,.4);cursor:pointer;transition:.15s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#fff;color:var(--main);border:2px solid var(--main);box-shadow:none}
.btn.green{background:var(--green);box-shadow:0 4px 12px rgba(92,184,92,.4)}
.btn:disabled{background:#ddd;color:#999;box-shadow:none}
.word-item{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px dashed #f0e4d8}
.word-item:last-child{border-bottom:none}
.w-emoji{width:38px;height:38px;border-radius:10px;background:#fff3e8;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.w-main{flex:1;min-width:0}
.w-word{font-size:16px;font-weight:700}
.w-ipa{font-size:12px;color:var(--blue);font-family:Georgia,serif}
.w-zh{font-size:12px;color:var(--muted)}

.rec{border:none;background:#e57373;color:#fff;width:32px;height:32px;border-radius:50%;font-size:13px;cursor:pointer;flex-shrink:0}
.rec.recording{animation:pulse 1s infinite;background:#d32f2f}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.rec.has-rec{background:var(--green)}
.play-rec{border:none;background:#9c6ade;color:#fff;width:32px;height:32px;border-radius:50%;font-size:13px;cursor:pointer;flex-shrink:0}
.rec-tip{font-size:11px;color:var(--muted);text-align:center;margin-top:6px}
.speak{border:none;background:var(--blue);color:#fff;width:32px;height:32px;border-radius:50%;font-size:14px;cursor:pointer;flex-shrink:0}
.progress-ring{width:64px;height:64px;margin:0 auto}
/* 日历 */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.cal-cell{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;font-weight:700;background:#f6ede2;color:var(--muted);position:relative}
.cal-cell .zh{font-size:9px;font-weight:400}
.cal-cell.done{background:var(--green);color:#fff}
.cal-cell.today{outline:3px solid var(--gold);outline-offset:1px}
.cal-cell.week{background:var(--gold);color:#fff}
.week-banner{background:linear-gradient(135deg,#f5b942,#f59e2c);color:#fff;border-radius:16px;padding:18px;text-align:center;margin-bottom:12px;box-shadow:var(--shadow)}
.week-banner h2{font-size:18px;margin-bottom:4px}
/* 周测 */
.quiz-q{font-size:20px;text-align:center;margin:10px 0}
.quiz-word{font-size:40px;font-weight:800;color:var(--main);font-family:'Arial Rounded MT Bold',Arial}
.quiz-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opt{background:#fff;border:2px solid #f0e4d8;border-radius:12px;padding:14px 8px;font-size:15px;text-align:center;cursor:pointer;transition:.15s}
.opt:active{transform:scale(.97)}
.opt.correct{border-color:var(--green);background:#eaf7ea}
.opt.wrong{border-color:#e57373;background:#fdecec}
.quiz-bar{height:8px;background:#f0e4d8;border-radius:4px;overflow:hidden;margin-bottom:14px}
.quiz-bar div{height:100%;background:var(--main);border-radius:4px;transition:.3s}
.score-big{font-size:56px;font-weight:800;text-align:center;color:var(--main)}
.stars{font-size:36px;text-align:center;margin:6px 0}
.badge-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.badge{background:#fff3e8;border-radius:10px;padding:6px 10px;font-size:12px}
.star-row{display:flex;align-items:center;gap:6px;font-size:15px}
.toast{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
.confetti{position:fixed;top:-10px;font-size:20px;animation:fall 2.5s linear forwards;z-index:98;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(360deg);opacity:.6}}
.sub{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
h3.sec{font-size:15px;margin:4px 0 10px;display:flex;align-items:center;gap:6px}
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px">
    <select id="user-select" style="max-width:60%;padding:6px 10px;border-radius:10px;border:none;font-size:14px;font-weight:600;background:rgba(255,255,255,.9);color:#7a4a2b"></select>
    <div style="display:flex;gap:6px">
      <button id="btn-add-user" style="border:none;border-radius:10px;padding:6px 12px;font-size:13px;font-weight:600;background:rgba(255,255,255,.35);color:#fff">＋ 新用户</button>
      <button id="btn-del-user" style="border:none;border-radius:10px;padding:6px 12px;font-size:13px;font-weight:600;background:rgba(255,255,255,.35);color:#fff">删除</button>
    </div>
  </div>
  <h1>🌟 字母拼读每日打卡</h1>
  <p>每天一个字母 · 自然拼读启蒙 · 每周周测复习</p>
  <div class="stats">
    <div class="stat"><b id="st-done">0</b><span>已学字母</span></div>
    <div class="stat"><b id="st-streak">0</b><span>连续打卡</span></div>
    <div class="stat"><b id="st-words">0</b><span>掌握单词</span></div>
    <div class="stat"><b id="st-stars">⭐0</b><span>周测星星</span></div>
  </div>
</header>
<nav>
  <button class="active" data-p="today">📖 今日</button>
  <button data-p="cal">📅 日历</button>
  <button data-p="quiz">📝 周测</button>
</nav>

<div class="page show" id="p-today">
  <div class="card" style="text-align:center">
    <div class="day-label" id="day-label"></div>
    <div class="big-letter" id="big-letter">A</div>
    <div class="big-letter lower" id="big-letter-lower" style="font-size:56px">a</div>
    <div class="sound" id="letter-sound"></div>
    <div class="sub" id="today-status"></div>
    <button class="btn" id="btn-start" style="margin-top:12px">开始学习 ▶</button>
  </div>
  <div class="card" id="learn-area" style="display:none">
    <h3 class="sec">🔤 <span id="learn-title"></span></h3>
    <div id="word-list"></div>
    <div class="rec-tip">🎤 点录音键会先播放原音，然后开始录音；再点一次结束。▶ 播放自己的录音跟原音对比</div>
    <button class="btn green" id="btn-finish" style="margin-top:14px">✅ 完成今日打卡</button>
  </div>
  <div class="card" id="done-card" style="display:none;text-align:center">
    <div style="font-size:44px">🎉</div>
    <div style="font-weight:700;font-size:17px;margin:6px 0">今日打卡完成！</div>
    <div class="sub">明天继续解锁下一个字母吧～</div>
  </div>
</div>

<div class="page" id="p-cal">
  <div class="card">
    <h3 class="sec">🗓 学习日历（26天行程）</h3>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="sub">🟩 已完成 · 🟨 周测日 · ⬜ 未开始</div>
  </div>
</div>

<div class="page" id="p-quiz">
  <div id="quiz-lock" class="card" style="text-align:center;display:none">
    <div style="font-size:40px">🔒</div>
    <div style="font-weight:700;margin:8px 0">周测还未解锁</div>
    <div class="sub" id="quiz-lock-reason"></div>
  </div>
  <div id="quiz-run" style="display:none">
    <div class="quiz-bar"><div id="quiz-prog" style="width:0%"></div></div>
    <div class="card">
      <div class="quiz-q" id="quiz-q"></div>
      <div class="quiz-word" id="quiz-word"></div>
      <div class="quiz-opts" id="quiz-opts"></div>
      <div class="sub">听发音选释义 / 看词选释义</div>
    </div>
  </div>
  <div id="quiz-result" class="card" style="display:none;text-align:center">
    <div class="score-big" id="quiz-score"></div>
    <div class="stars" id="quiz-stars"></div>
    <div class="sub" id="quiz-comment"></div>
    <div class="badge-row" id="quiz-badges"></div>
    <button class="btn ghost" id="btn-quiz-back" style="margin-top:14px">返回继续学习</button>
  </div>
</div>


<div id="user-gate" style="display:none;position:fixed;inset:0;background:rgba(60,40,25,.55);z-index:100;align-items:center;justify-content:center;padding:20px">
  <div style="background:#fff;border-radius:20px;padding:24px;max-width:360px;width:100%;text-align:center">
    <div style="font-size:40px">👶</div>
    <div style="font-weight:800;font-size:18px;margin:8px 0 4px">谁在学习？</div>
    <div class="sub" style="margin-bottom:14px">每个孩子一个专属档案，进度独立保存</div>
    <div id="gate-list" style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px"></div>
    <div style="display:flex;gap:8px">
      <input id="gate-name" placeholder="输入新用户名字" style="flex:1;padding:12px;border:2px solid #f0e4d8;border-radius:12px;font-size:15px">
      <button id="gate-create" style="border:none;border-radius:12px;padding:0 18px;font-weight:700;color:#fff;background:var(--main);font-size:15px">创建</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

const LETTERS = "abcdefghijklmnopqrstuvwxyz".split("");
const DAY_MS = 86400000, WEEK_DAYS = 7;
let DB = loadDB();
let S = curUser()?load():fresh();

function loadDB(){
  try{ return JSON.parse(localStorage.getItem('phonics_users_v2')) || {users:{},cur:null}; }
  catch(e){ return {users:{},cur:null}; }
}
function saveDB(){ localStorage.setItem('phonics_users_v2', JSON.stringify(DB)); }
function fresh(){ return {start: Date.now(), done: {}, stars: {}, quizWeeks: {}}; }
function load(){
  try{ return JSON.parse(localStorage.getItem('phonics_p_'+DB.cur)) || fresh(); }
  catch(e){ return fresh(); }
}
function save(){ if(DB.cur){ DB.users[DB.cur]=true; saveDB(); localStorage.setItem('phonics_p_'+DB.cur, JSON.stringify(S)); } }
function curUser(){ return DB.cur; }
function listUsers(){ return Object.keys(DB.users); }
function switchUser(name){
  if(!name||!DB.users[name])return;
  DB.cur=name; saveDB(); S=load(); renderAll();
}
function createUser(name){
  name=(name||'').trim(); if(!name)return false;
  if(!DB.users[name]){ DB.users[name]=true; }
  DB.cur=name; saveDB(); S=fresh(); save(); renderAll();
  return true;
}
function delUser(name){
  if(!DB.users[name])return;
  delete DB.users[name];
  localStorage.removeItem('phonics_p_'+name);
  if(DB.cur===name){ DB.cur=listUsers()[0]||null; S=DB.cur?load():fresh(); }
  saveDB(); renderAll();
}

function dayIndex(){ return Math.floor((Date.now()-S.start)/DAY_MS); }
function weekOf(d){ return Math.floor(d/WEEK_DAYS); }
function letterOfDay(d){ return LETTERS[Math.min(d,25)]; }
function isQuizDay(d){ return (d>0 && d%WEEK_DAYS===0); }
function today(){ return dayIndex(); }

function speak(t){
  try{
    const u=new SpeechSynthesisUtterance(t);
    u.lang='en-US'; u.rate=0.75;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}
/* 真人发音：有道词典在线音频，失败时回退合成语音 */
function playWord(word){
  try{ speechSynthesis.cancel(); }catch(e){}
  const a=new Audio('https://dict.youdao.com/dictvoice?type=2&audio='+encodeURIComponent(word));
  let ok=false;
  a.play().catch(()=>{});
  a.addEventListener('error',()=>{ if(!ok){ ok=true; speak(word);} });
  a.addEventListener('playing',()=>{ ok=true; });
}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}
function confetti(){
  const em=['🎉','⭐','🎈','✨','🎊'];
  for(let i=0;i<18;i++){
    const s=document.createElement('div');
    s.className='confetti'; s.textContent=em[i%em.length];
    s.style.left=Math.random()*100+'vw';
    s.style.animationDelay=(Math.random()*0.6)+'s';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),3200);
  }
}

/* ---------- 录音跟读 ---------- */
let recStream=null, recMedia=null, recActiveBtn=null;
function setupRecorder(row, word){
  const btn=row.querySelector('.rec'), play=row.querySelector('.play-rec');
  let chunks=[], audio=null;
  async function start(){
    try{
      if(recActiveBtn && recActiveBtn!==btn){ stopActive(); }
      recStream=await navigator.mediaDevices.getUserMedia({audio:true});
      recMedia=new MediaRecorder(recStream);
      chunks=[];
      recMedia.ondataavailable=e=>chunks.push(e.data);
      recMedia.onstop=()=>{
        audio=new Blob(chunks,{type:recMedia.mimeType||'audio/webm'});
        recStream.getTracks().forEach(t=>t.stop()); recStream=null;
        btn.classList.remove('recording'); btn.classList.add('has-rec'); btn.textContent='🎤';
        play.style.display='inline-block';
        recActiveBtn=null; toast('录音完成，点 ▶ 听自己的发音');
      };
      recMedia.start();
      btn.classList.add('recording'); btn.textContent='⏹';
      recActiveBtn={stop(){ if(recMedia&&recMedia.state!=='inactive')recMedia.stop(); }};
      play.style.display='none';
    }catch(e){ toast('无法访问麦克风，请检查权限'); }
  }
  function stopActive(){ if(recActiveBtn){recActiveBtn.stop(); recActiveBtn=null;} }
  btn.onclick=()=>{
    if(btn.classList.contains('recording')){ stopActive(); }
    else{ playWord(word); setTimeout(start, 800); toast('先听发音，随后开始跟读…'); }
  };
  play.onclick=()=>{
    if(!audio)return;
    const a=new Audio(URL.createObjectURL(audio)); a.play();
  };
}

/* ---------- 日历 ---------- */
function renderCal(){
  const grid=document.getElementById('cal-grid');
  grid.innerHTML='';
  const d=today();
  for(let i=0;i<26;i++){
    const cell=document.createElement('div');
    cell.className='cal-cell'+(S.done[i]?' done':'')+(isQuizDay(i)?' week':'')+(i===Math.min(d,25)?' today':'');
    const L=LETTERS[i];
    cell.innerHTML=(isQuizDay(i)?'🧪':L.toUpperCase())+`<span class="zh">${S.done[i]?'✓':(isQuizDay(i)?'周测':'')}</span>`;
    grid.appendChild(cell);
  }
}

/* ---------- 周测 ---------- */
let quiz=null;
function renderQuiz(){
  const d=today(), wk=weekOf(d);
  const lock=document.getElementById('quiz-lock'), run=document.getElementById('quiz-run'), res=document.getElementById('quiz-result');
  res.style.display='none';
  const prevEnd = wk*WEEK_DAYS; // days completed this week: prevEnd-7 .. prevEnd-1
  const learned=[];
  for(let i=Math.max(0,prevEnd-WEEK_DAYS); i<prevEnd && i<26; i++){
    if(S.done[i] && !isQuizDay(i)) learned.push(i);
  }
  if(learned.length<3){
    lock.style.display='block'; run.style.display='none';
    document.getElementById('quiz-lock-reason').textContent=`本周还需再学 ${3-learned.length} 个字母才能参加周测（先去"今日"打卡吧）`;
    return;
  }
  if(S.quizWeeks[wk]){
    // already taken: show result
    const sc=S.quizWeeks[wk];
    lock.style.display='none'; run.style.display='none'; res.style.display='block';
    showScore(sc.correct, sc.total, wk, true);
    return;
  }
  lock.style.display='none';
  startQuiz(learned, wk);
}
function startQuiz(learned, wk){
  // build 10 questions: meaning-choice from learned letters' words
  const pool=[];
  learned.forEach(i=>DATA[LETTERS[i]].words.forEach(w=>pool.push({...w,L:LETTERS[i]})));
  shuffle(pool);
  const qs=pool.slice(0,10);
  quiz={qs, idx:0, correct:0, wk};
  run.style.display='block';
  showQ();
}
function showQ(){
  const q=quiz.qs[quiz.idx];
  document.getElementById('quiz-prog').style.width=(quiz.idx/quiz.qs.length*100)+'%';
  document.getElementById('quiz-q').textContent=`第 ${quiz.idx+1}/${quiz.qs.length} 题 · 字母 ${q.L.toUpperCase()}`;
  const wEl=document.getElementById('quiz-word');
  wEl.textContent=q.w;
  wEl.onclick=()=>playWord(q.w);
  playWord(q.w);
  // options: correct zh + 3 distractors
  const all=Object.values(DATA).flatMap(x=>x.words);
  const distr=[]; const used=new Set([q.zh]);
  while(distr.length<3){
    const c=all[Math.floor(Math.random()*all.length)].zh;
    if(!used.has(c)){used.add(c);distr.push(c);}
  }
  const opts=shuffle([q.zh,...distr]);
  const box=document.getElementById('quiz-opts'); box.innerHTML='';
  opts.forEach(o=>{
    const b=document.createElement('button'); b.className='opt'; b.textContent=o;
    b.onclick=()=>{
      if(b.disabled)return;
      if(o===q.zh){ b.classList.add('correct'); quiz.correct++; speak('good'); }
      else{ b.classList.add('wrong'); playWord(q.w); toast(`正确答案：${q.zh}`); }
      [...box.children].forEach(x=>x.disabled=true);
      setTimeout(()=>{ quiz.idx++; quiz.idx<quiz.qs.length?showQ():endQuiz(); },900);
    };
    box.appendChild(b);
  });
}
function endQuiz(){
  document.getElementById('quiz-run').style.display='none';
  showScore(quiz.correct, quiz.qs.length, quiz.wk, false);
  S.quizWeeks[quiz.wk]={correct:quiz.correct,total:quiz.qs.length};
  save(); renderStats();
}
function showScore(c,t,wk,already){
  document.getElementById('quiz-result').style.display='block';
  document.getElementById('quiz-score').textContent=`${c} / ${t}`;
  const stars=c>=9?3:c>=7?2:c>=5?1:0;
  S.stars[wk]=Math.max(S.stars[wk]||0,stars); save();
  document.getElementById('quiz-stars').textContent='⭐'.repeat(stars)+'☆'.repeat(3-stars);
  const cm=['再接再厉，明天继续加油！','不错哦，接近满分啦！','太棒了，拼写小达人！','满分！你就是字母明星🌟'];
  document.getElementById('quiz-comment').textContent=already?'本周已测，这是你的成绩':cm[stars];
  const badges=document.getElementById('quiz-badges'); badges.innerHTML='';
  const names={1:'🥉 拼读新手',2:'🥈 拼读高手',3:'🥇 拼读冠军'};
  for(let w=0;w<=wk;w++) if(S.stars[w]) { const b=document.createElement('span'); b.className='badge'; b.textContent=names[S.stars[w]]||''; badges.appendChild(b); }
  if(!already && stars>=2) confetti();
}
document.getElementById('btn-quiz-back').addEventListener('click',()=>{switchPage('today')});

/* ---------- utils ---------- */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function renderStats(){
  const done=Object.keys(S.done).filter(k=>!isQuizDay(+k)).length;
  let streak=0, d=today();
  while(S.done[d-streak]&&d-streak>=0)streak++;
  document.getElementById('st-done').textContent=done;
  document.getElementById('st-streak').textContent=streak;
  let wc=0; for(const k in S.done){ if(!isQuizDay(+k)) wc+=DATA[LETTERS[Math.min(+k,25)]].words.length; }
  document.getElementById('st-words').textContent=wc;
  let st=0; for(const k in S.stars) st+=S.stars[k];
  document.getElementById('st-stars').textContent='⭐'+st;
}
function switchPage(p){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===p));
  document.querySelectorAll('.page').forEach(x=>x.classList.toggle('show',x.id==='p-'+p));
  if(p==='cal')renderCal();
  if(p==='quiz')renderQuiz();
  if(p==='today')renderToday();
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>switchPage(b.dataset.p));

function renderUserBar(){
  const sel=document.getElementById('user-select');
  sel.innerHTML='';
  listUsers().forEach(n=>{
    const o=document.createElement('option'); o.value=n; o.textContent='👤 '+n;
    if(n===DB.cur)o.selected=true; sel.appendChild(o);
  });
  if(!DB.cur){ const o=document.createElement('option'); o.textContent='未选择用户'; sel.appendChild(o); }
}
function renderGate(){
  const gate=document.getElementById('user-gate');
  if(DB.cur){ gate.style.display='none'; return; }
  gate.style.display='flex';
  const l=document.getElementById('gate-list'); l.innerHTML='';
  listUsers().forEach(n=>{
    const b=document.createElement('button');
    b.style.cssText='border:2px solid var(--main);background:#fff3e8;border-radius:12px;padding:12px;font-size:16px;font-weight:700;color:var(--main-d)';
    b.textContent='👤 '+n;
    b.onclick=()=>switchUser(n);
    l.appendChild(b);
  });
}
document.getElementById('user-select').onchange=e=>switchUser(e.target.value);
document.getElementById('btn-add-user').onclick=()=>{
  const n=prompt('输入新用户名字：');
  if(n && createUser(n)) toast('已创建用户：'+n.trim());
};
document.getElementById('btn-del-user').onclick=()=>{
  if(!DB.cur){toast('请先选择用户');return;}
  if(confirm('确定删除用户「'+DB.cur+'」的全部学习记录？此操作不可恢复。')){ const n=DB.cur; delUser(n); toast('已删除'); }
};
document.getElementById('gate-create').onclick=()=>{
  const v=document.getElementById('gate-name').value;
  if(v && createUser(v)){ toast('欢迎，'+v.trim()+'！'); }
  else toast('请输入名字');
};
function renderAll(){
  renderUserBar(); renderGate(); renderToday(); renderStats(); renderCal();
}
renderAll();

/* ---------- 离线缓存注册 ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
</body>
